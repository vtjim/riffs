name: Rebuild Vermont listings

# Rebuilds data/vermont.json from the digest's Google Calendars and publishes it.
# Runs each morning after the 7 AM digest, again late afternoon, and on demand
# (Actions tab -> "Rebuild Vermont listings" -> Run workflow).

on:
  schedule:
    - cron: "30 12 * * *"   # 8:30 AM Eastern (7:30 AM in winter)
    - cron: "0 21 * * *"    # 5:00 PM Eastern (4:00 PM in winter)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-vermont
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/vermont.json from calendars
        env:
          MUSIC_ICS_URL: ${{ secrets.MUSIC_ICS_URL }}
          MOVIES_ICS_URL: ${{ secrets.MOVIES_ICS_URL }}
          RIDGELINES_ICS_URL: ${{ secrets.RIDGELINES_ICS_URL }}
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
          HOME_TOWN: ${{ secrets.HOME_TOWN }}
        run: python scripts/build_vermont.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/vermont.json; then
            echo "No changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vermont.json
          git commit -m "vermont data $(TZ=America/New_York date +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to redeploy
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
