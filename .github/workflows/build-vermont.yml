name: Rebuild Vermont listings

# Rebuilds data/vermont.json from the digest's Google Calendars and publishes it.
# Runs each morning after the 7 AM digest, again late afternoon, and on demand
# (Actions tab -> "Rebuild Vermont listings" -> Run workflow).

on:
  schedule:
    # GitHub's scheduled runs are best-effort and drift, worse right on the
    # :00/:30 marks — 12:50 UTC aims to land comfortably before 9 AM Eastern
    # rather than exactly at it (Jim asked for "by 9am every morning").
    - cron: "50 12 * * *"   # ~8:50 AM Eastern (~7:50 AM in winter)
    - cron: "5 21 * * *"    # ~5:05 PM Eastern (~4:05 PM in winter)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-vermont
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/vermont.json from calendars
        id: vermont
        continue-on-error: true
        env:
          MUSIC_ICS_URL: ${{ secrets.MUSIC_ICS_URL }}
          MOVIES_ICS_URL: ${{ secrets.MOVIES_ICS_URL }}
          RIDGELINES_ICS_URL: ${{ secrets.RIDGELINES_ICS_URL }}
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
          HOME_TOWN: ${{ secrets.HOME_TOWN }}
        run: python scripts/build_vermont.py

      # The trip page, from the West Coast Trip calendar. Skipped quietly until
      # WESTCOAST_ICS_URL is set; a failure here doesn't hold back Vermont.
      - name: Build data/westcoast.json from the trip calendar
        id: westcoast
        continue-on-error: true
        env:
          WESTCOAST_ICS_URL: ${{ secrets.WESTCOAST_ICS_URL }}
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
          HOME_TOWN: ${{ secrets.HOME_TOWN }}
        run: python scripts/build_westcoast.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/vermont.json data/westcoast.json; then
            echo "No changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vermont.json data/westcoast.json
          git commit -m "listings $(TZ=America/New_York date +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to redeploy
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      # Show red in the Actions list when a build failed, after publishing whatever did work.
      - name: Report build failures
        if: steps.vermont.outcome == 'failure' || steps.westcoast.outcome == 'failure'
        run: |
          echo "vermont: ${{ steps.vermont.outcome }}  westcoast: ${{ steps.westcoast.outcome }}"
          exit 1
